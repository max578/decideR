url: https://max578.github.io/decideR
template:
  bootstrap: 5
reference:
  - title: Decisions
    desc: >
      The core engine and the two reference decisions built on it.
    contents:
      - has_concept("decisions")
  - title: Manifest tail
    desc: >
      Deciding directly from an upstream `orchestra_manifest`.
    contents:
      - has_concept("manifest")
  - title: Value
    desc: >
      Value of information (EVPI, EVSI) and the discounted benefit-cost ratio.
    contents:
      - has_concept("value")
      - print.decider_bcr
      - as.data.frame.decider_bcr
  - title: Grounding
    desc: >
      The Independent Oracle Principle provenance vocabulary.
    contents:
      - has_concept("grounding")
  - title: Loss
    desc: >
      Threshold-economics (grade-band) loss primitives.
    contents:
      - has_concept("loss")
      - print.grade_band_value
articles:
  - title: Articles
    navbar: ~
    contents:
      - getting-started
